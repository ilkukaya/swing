name: Swing daily scan

on:
  schedule:
    - cron: '0 16 * * 1-5'   # hafta ici 16:00 UTC (~19:00 TR, BIST kapanis sonrasi)
  workflow_dispatch: {}       # elle tetikleme (Actions sekmesinden "Run workflow")

permissions:
  contents: write             # data/ klasorunu commit'lemek icin

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Tarama + takip
        run: python run.py
      - name: Veriyi commit'le
        run: |
          git config user.name  "swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) tarama [skip ci]"
          git push
