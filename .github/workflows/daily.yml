name: Swing daily scan

on:
  schedule:
    - cron: '10 16 * * 1-5'   # hafta ici 16:10 UTC (~19:10 TR, BIST kapanisi sonrasi; tam saat yogunlugundan kacinir)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Tarama + takip
        run: python run.py
      - name: Veriyi commit'le
        run: |
          git config user.name  "swing-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) tarama [skip ci]"
          git push
